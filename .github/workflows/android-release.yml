name: Android release

# Manual: checks, then a signed release AAB built on the runner (no EAS, decision 019), uploaded to a Google Play
# track and kept as a workflow artifact. versionCode = ANDROID_VERSION_CODE_OFFSET (default 100) + this workflow's
# run number (docs/release.md).
on:
  workflow_dispatch:
    inputs:
      track:
        description: Play track (alpha = closed testing)
        type: choice
        options: [internal, alpha, beta, production]
        default: alpha
      status:
        description: Release status (draft while the Play app itself is still a draft)
        type: choice
        options: [draft, completed]
        default: draft
      upload:
        description: Upload to Google Play (otherwise only build the artifact)
        type: boolean
        default: true
      rnrepo:
        description: Use RNRepo prebuilt native libraries (off = compile all of them from source)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  release:
    name: Build & upload
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      # Gradle 9 and the React Native Gradle plugin need JDK 17+; 17 is what React Native documents.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: pnpm install --frozen-lockfile

      - name: Version
        env:
          OFFSET: ${{ vars.ANDROID_VERSION_CODE_OFFSET || '100' }}
        run: |
          version="$(node -p "require('./app.json').expo.version")"
          code="$((GITHUB_RUN_NUMBER + OFFSET))"
          echo "APP_VERSION=${version}" >> "$GITHUB_ENV"
          echo "GEOQUIZ_VERSION_CODE=${code}" >> "$GITHUB_ENV"
          echo "Globik ${version} (versionCode ${code})" >> "$GITHUB_STEP_SUMMARY"

      - name: Write the upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # Without these the plugin would fall back to debug signing, which Play rejects; fail here instead.
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set (docs/release.md, Secrets and variables)"
              exit 1
            fi
          done
          keystore="$RUNNER_TEMP/upload.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          {
            echo "GEOQUIZ_UPLOAD_STORE_FILE=$keystore"
            echo "GEOQUIZ_UPLOAD_STORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "GEOQUIZ_UPLOAD_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "GEOQUIZ_UPLOAD_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      # The RNRepo Gradle plugin is off whenever DISABLE_RNREPO is set, to any value (decision 022).
      - name: Disable RNRepo
        if: ${{ !inputs.rnrepo }}
        run: echo "DISABLE_RNREPO=1" >> "$GITHUB_ENV"

      # Swap absorbs the peaks of parallel C++ compiles (each Gradle worker runs one compiler per core); without it
      # the runner ran out of memory and was shut down mid-build, though the same commit had passed before.
      - name: Add swap
        run: |
          sudo fallocate -l 8G /extra-swap
          sudo chmod 600 /extra-swap
          sudo mkswap /extra-swap
          sudo swapon /extra-swap
          free -h
      - run: npx expo prebuild -p android --no-install
        env:
          NODE_ENV: production
      # Configuration only, no compiling: RNRepo prints which libraries come prebuilt and which fall back to source
      # at the info level, which the real build would bury in its log. Same JVM arguments as the build below, so it
      # reuses this daemon instead of leaving an idle one holding memory.
      - name: RNRepo prebuilt libraries
        if: ${{ inputs.rnrepo }}
        working-directory: android
        env:
          NODE_ENV: production
        run: |
          ./gradlew bundleRelease --dry-run --info -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g" \
            -PreactNativeArchitectures=armeabi-v7a,arm64-v8a,x86_64 \
            | awk '/RNRepo\] Found the following supported prebuilt packages/{p=1} /RNRepo\] Provider package/{p=0} p' \
            > "$RUNNER_TEMP/rnrepo.txt"
          cat "$RUNNER_TEMP/rnrepo.txt"
          { echo '### RNRepo'; echo '```'; cat "$RUNNER_TEMP/rnrepo.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Build the release bundle
        working-directory: android
        env:
          NODE_ENV: production
        # The generated gradle.properties caps the daemon at 2 GB, too little for a release build. A bigger heap plus
        # parallel C++ builds for every ABI ran the 16 GB runner out of memory (it was shut down), so: 4 GB, two
        # workers (three still ran out once), swap (above), and no 32-bit x86 (emulators only; Play needs the 64-bit ABIs). Keep these limits while any C++
        # library (worklets, reanimated, Skia) still builds from source; RNRepo prebuilds would remove that load.
        run: >-
          ./gradlew bundleRelease --max-workers=2
          -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"
          -PreactNativeArchitectures=armeabi-v7a,arm64-v8a,x86_64

      - name: Keep AAB and mapping
        uses: actions/upload-artifact@v7
        with:
          name: globik-android-${{ env.APP_VERSION }}-${{ env.GEOQUIZ_VERSION_CODE }}
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload to Google Play
        if: inputs.upload
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.michalczernek.geoquiz
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          mappingFile: android/app/build/outputs/mapping/release/mapping.txt
          releaseName: ${{ env.APP_VERSION }} (${{ env.GEOQUIZ_VERSION_CODE }})
          track: ${{ inputs.track }}
          status: ${{ inputs.status }}

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
