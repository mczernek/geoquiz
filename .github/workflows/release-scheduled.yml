name: Scheduled release

# One-off, asked for before tag releases existed: Netlify refused deploys (free plan usage) until the billing period
# reset on 2026-11-26 08:00 UTC. At 08:15 UTC this tags main's head `release-<version>` (`-2`, `-3`… if taken) and
# deploys it. The deploy is called here because a tag pushed with GITHUB_TOKEN doesn't start deploy.yml.
# Delete this file after it has run (decision 024).
on:
  schedule:
    - cron: '15 8 26 11 *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only print the tag that would be created; no tag, no deploy
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-scheduled
  cancel-in-progress: false

jobs:
  tag:
    name: Tag main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.name.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Pick the tag name
        id: name
        run: |
          version=$(node -p "require('./package.json').version")
          tag="release-$version"
          n=2
          while git rev-parse -q --verify "refs/tags/$tag" >/dev/null; do
            tag="release-$version-$n"
            n=$((n + 1))
          done
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Tag for $GITHUB_SHA: \`$tag\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Push the tag
        if: github.event_name == 'schedule' || !inputs.dry_run
        env:
          TAG: ${{ steps.name.outputs.tag }}
        run: |
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"

  deploy:
    name: Deploy
    needs: tag
    if: github.event_name == 'schedule' || !inputs.dry_run
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
