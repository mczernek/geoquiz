name: Deploy

# Pushing a `release-*` tag: checks, then database migrations, then the web app to Netlify production
# (https://globik-app.netlify.app). Only tags deploy, not every merge to main, so Netlify's free-plan credits last
# (decision 024). Migrations run before the client ships, so they must stay backward compatible with released apps.
# Android builds are manual: android-release.yml (docs/release.md).
on:
  push:
    tags: ['release-*']
  workflow_dispatch:
  # A tag pushed from a workflow with GITHUB_TOKEN doesn't trigger this one, so a workflow that tags
  # must call it directly.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  migrate:
    name: Database migrations
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      # Session pooler URL with the password (GitHub runners have no IPv6).
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Check secrets
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL is not set (docs/release.md, Secrets and variables)"
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npx --yes supabase@3.0.0 migration list --remote="$SUPABASE_DB_URL"
      - run: npx --yes supabase@3.0.0 db push --remote="$SUPABASE_DB_URL" --yes

  web:
    name: Deploy web (Netlify)
    needs: migrate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://globik-app.netlify.app
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
      # Search Console ownership tag in index.html (docs/release.md, Google OAuth consent screen).
      EXPO_PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ vars.EXPO_PUBLIC_GOOGLE_SITE_VERIFICATION }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:web
      - name: Deploy to production
        run: npx --yes netlify-cli@27.16.1 deploy --dir dist --prod --message "main ${{ github.sha }}"
