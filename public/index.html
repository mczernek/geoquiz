<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <!-- The template of the web app's index.html (decision 023): the app is a single-page app, so this static text is
         what crawlers and Google's OAuth reviewers read before JavaScript runs. -->
    <meta
      name="description"
      content="Globik: learn the world's countries — their flags, capitals and where they are — on a 3D globe. Free, no ads, no tracking. For Android, iOS and the web."
    />
    <link rel="privacy-policy" href="/privacy/" />
    <link rel="terms-of-service" href="/terms/" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>
      <main style="font-family: system-ui, sans-serif; max-width: 640px; margin: 0 auto; padding: 24px 16px">
        <h1>Globik</h1>
        <p lang="en">
          Learn the world's countries — their flags, capitals and where they are — on a 3D globe. Spaced repetition
          brings back what you're about to forget; progress syncs between your devices. Free, no ads, no tracking. For
          Android, iOS and the web. Please enable JavaScript to use the web app.
        </p>
        <p lang="pl">
          Poznaj kraje świata — ich flagi, stolice i położenie — na globusie 3D. Powtórki wracają wtedy, gdy zaczynasz
          zapominać; postępy synchronizują się między urządzeniami. Za darmo, bez reklam i śledzenia. Na Androida, iOS i
          w przeglądarce. Włącz JavaScript, żeby korzystać z aplikacji.
        </p>
        <p>
          <a href="/privacy/">Privacy policy / Polityka prywatności</a> · <a href="/terms/">Terms / Regulamin</a> ·
          <a href="/delete-account/">Delete account / Usuń konto</a>
        </p>
      </main>
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
