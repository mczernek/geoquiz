# Local development config (`supabase start`). Production auth settings: supabase/scripts/apply-auth-config.sh.
project_id = "geoquiz"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[auth]
enabled = true
site_url = "http://localhost:8081"
additional_redirect_urls = ["geoquiz://**"]
enable_anonymous_sign_ins = true
minimum_password_length = 8

[auth.email]
enable_signup = true
enable_confirmations = false
